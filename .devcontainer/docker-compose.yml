services:
  dev-service:
    # Paths are relative to this Compose file (.devcontainer/).
    # dockerfile is resolved from the build context (the repo root).
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - bashhistory:/commandhistory
    command: /bin/sh -c "while sleep 1000; do :; done"
    networks:
      - internal

networks:
  internal:

volumes:
  bashhistory:
